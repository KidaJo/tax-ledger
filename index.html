<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稅務台帳</title>
<style>

  :root{
    --paper:#F4F1E8;
    --surface:#FFFDF7;
    --ink:#191817;
    --ink-2:#55514A;
    --ink-3:#8B8579;
    --line:#E4DFD3;
    --line-2:#D3CCBC;
    --accent:#9C3A2A;
    --accent-soft:#F3E4DF;
    --ok:#3F6B4A;
    --warn:#8A6218;
    --serif:"Iowan Old Style","Songti TC","Noto Serif TC",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --r:14px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:13px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

  /* rail */
  .rail{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    padding:28px 20px 20px;border-right:1px solid var(--line);
    background:linear-gradient(180deg,#F7F4EC,#F4F1E8 320px);
  }
  .brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
  .brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
  .brand span{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
  .who{padding:2px 8px 24px;color:var(--ink-3);font-size:11px}
  nav{display:flex;flex-direction:column;gap:2px}
  nav a{
    display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;
    color:var(--ink-2);text-decoration:none;border-radius:8px;font-size:13px;
    transition:background-color .15s,color .15s;
  }
  nav a svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  nav a:hover{background:#EDE9DE;color:var(--ink)}
  nav a.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  nav a.on svg{opacity:1;color:var(--accent)}
  .rail-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--line);color:var(--ink-3);font-size:10.5px;line-height:1.7}

  /* main */
  main{padding:32px 40px 80px;max-width:1400px}
  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  h1{font-family:var(--serif);font-size:36px;line-height:1.15;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--ink-2);margin:0;max-width:56ch}
  .stamp{display:flex;gap:16px;margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .stamp span{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--accent)}

  section{scroll-margin-top:24px;padding-top:44px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:20px}
  .sec-head h2{font-family:var(--serif);font-size:20px;font-weight:500;margin:0}
  .sec-head p{margin:0;color:var(--ink-3);font-size:11.5px;font-family:var(--mono)}

  /* overview grid */
  .overview{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:stretch}
  .stat-stack{display:grid;grid-template-rows:1fr 1fr;gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .stat{padding:20px 22px;display:flex;flex-direction:column;justify-content:center}
  .stat .lab{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
  .stat .big{font-family:var(--serif);font-size:34px;line-height:1.1;margin:6px 0 2px;letter-spacing:-.015em}
  .stat .big small{font-size:14px;font-family:var(--sans);color:var(--ink-2);margin-left:4px}
  .stat .sub{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .stat.accent{background:var(--accent-soft);border-color:#E4CFC8}
  .stat.accent .big{color:var(--accent)}
  .stat.accent .lab,.stat.accent .sub{color:#8A6258}

  /* chart */
  .chartcard{padding:22px 24px 18px;display:flex;flex-direction:column}
  .chartcard header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
  .chartcard h3{font-size:12px;font-weight:500;margin:0;color:var(--ink-2)}
  .chartcard .legend{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:flex;gap:14px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .legend i.past{background:#D9D3C4}
  .legend i.plan{background:var(--accent)}
  .plotwrap{padding-top:30px;margin-left:46px}
  .plot{position:relative;height:206px;border-bottom:1px solid var(--line-2)}
  .gl{position:absolute;left:-46px;right:0;border-top:1px dashed #E8E3D7;display:flex;align-items:center}
  .gl span{width:38px;text-align:right;font-family:var(--mono);font-size:9.5px;color:#A9A294;transform:translateY(-50%)}
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:12px}
  .col{position:relative;flex:1;height:100%}
  .bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:62%;max-width:76px;background:#D9D3C4;border-radius:3px 3px 0 0;transition:background-color .15s}
  .bar.plan{background:var(--accent)}
  .bar:hover{background:#C7BFAC}
  .bar.plan:hover{background:#87301F}
  .vlab{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
  .vlab.plan{color:var(--accent);font-weight:600}
  .years{display:flex;gap:12px;margin:8px 0 0 46px}
  .years div{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .years div.plan{color:var(--accent)}
  .chartnote{margin:14px 0 0;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}

  /* tax grid */
  .taxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .mkt{padding:18px 20px 8px;display:flex;flex-direction:column}
  .mkt header{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .mkt h3{margin:0;font-family:var(--serif);font-size:17px;font-weight:500}
  .mkt .flag{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em}
  .mkt .count{font-size:10.5px;color:var(--accent)}
  .mkt .count.zero{color:var(--ink-3)}
  .row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #F0ECE2;align-items:start}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink-2);font-size:12px}
  .row .k em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .row .v{text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink);display:flex;align-items:center;gap:6px;justify-content:flex-end}
  .row .v .dot{width:6px;height:6px}
  .row .v.pending{color:var(--ink-3)}

  /* todos */
  .filters{display:flex;gap:6px;margin-bottom:16px}
  .filters button{
    font:inherit;font-size:11.5px;padding:5px 12px;border-radius:999px;cursor:pointer;
    background:transparent;border:1px solid var(--line-2);color:var(--ink-2);
    transition:background-color .15s,color .15s,border-color .15s;
  }
  .filters button:hover{background:#EDE9DE}
  .filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FBF8F0}
  .group{margin-bottom:22px}
  .group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .group-head h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
  .group-head span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .todo{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:9px 10px 9px 0;border-bottom:1px solid #EDE8DC}
  .todo:hover{background:#F9F6EE}
  .box{
    width:15px;height:15px;margin-top:2px;border:1.5px solid var(--line-2);border-radius:4px;
    background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:background-color .15s,border-color .15s;
  }
  .box svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4;fill:none;opacity:0;transition:opacity .12s}
  .todo.done .box{background:var(--ok);border-color:var(--ok)}
  .todo.done .box svg{opacity:1}
  .todo.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
  .t{font-size:12.5px}
  .t em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .todo.overdue{border-left:2px solid var(--accent);padding-left:10px;margin-left:-12px}
  .when{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
  .when.hot{color:var(--accent)}

  /* calendar */
  .cal{border-left:1px solid var(--line-2);margin-left:8px;padding-left:22px}
  .ev{position:relative;padding:0 0 20px}
  .ev::before{content:"";position:absolute;left:-27px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line-2)}
  .ev.now::before{background:var(--accent);border-color:var(--accent)}
  .ev .d{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
  .ev .m{font-size:12.5px;margin-top:1px}
  .ev .s{font-size:11px;color:var(--ink-3);margin-top:1px}
  .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);vertical-align:1px;margin-left:6px}
  .tag.cn{color:#7A4A2A;border-color:#E0CBB8;background:#F8F0E6}
  .tag.tw{color:#2F5A46;border-color:#C6D8CD;background:#EEF4F0}
  .tag.us{color:#33456B;border-color:#C8D0E0;background:#EEF1F7}

  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line-2);color:var(--ink-3);font-size:10.5px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-family:var(--mono)}

  @media (max-width:1080px){
    .app{grid-template-columns:minmax(0,1fr)}
    main{min-width:0;max-width:100%;padding:24px 20px 64px}
    .rail{position:relative;height:auto;flex-direction:column;align-items:stretch;gap:12px;border-right:0;border-bottom:1px solid var(--line);padding:16px 20px 10px}
    .who,.rail-foot{display:none}
    nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{white-space:nowrap;height:32px}
    .overview,.taxgrid{grid-template-columns:1fr}
    .stat-stack{grid-template-columns:1fr 1fr;grid-template-rows:auto}
    h1{font-size:28px}
    .plotwrap{margin-left:38px}
    .plot .gl{left:-38px}
    .gl span{width:32px}
    .years{margin-left:38px}
    .vlab{font-size:9.5px}
    table{min-width:660px}
  }
  @media (max-width:620px){
    .stat-stack{grid-template-columns:1fr}
    .stat .big{font-size:28px}
    .stamp{flex-wrap:wrap;gap:10px}
  }


  .lock{min-height:100vh;display:grid;place-items:center;padding:24px}
  .lock-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 26px 24px}
  .lock .brand{font-family:var(--serif);font-size:20px;display:flex;align-items:baseline;gap:8px;padding:0}
  .lock .brand span{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
  .lock p{margin:8px 0 0;color:var(--ink-3);font-size:12px}
  .lock input[type=checkbox]{accent-color:var(--accent)}
  .lock label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);margin:14px 0 0;cursor:pointer}
  .lock input[type=password]{width:100%;margin-top:18px;padding:11px 12px;font:inherit;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:8px;outline:none}
  .lock input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(156,58,42,.12)}
  .lock button{width:100%;margin-top:16px;padding:11px;font:inherit;font-size:12.5px;color:#FBF8F0;background:var(--ink);border:0;border-radius:8px;cursor:pointer;transition:background-color .15s}
  .lock button:hover{background:#2C2A27}
  .lock button[disabled]{opacity:.5;cursor:default}
  .err{margin:10px 0 0;font-size:11.5px;color:var(--accent);min-height:16px}
  [hidden]{display:none!important}

</style>
</head>
<body>
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="brand">稅務台帳<span>2026</span></div>
    <p>輸入存取碼檢視你的稅務資料</p>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="存取碼">
    <label><input type="checkbox" id="remember" checked> 在此裝置保留 30 天</label>
    <button id="go">解鎖</button>
    <p class="err" id="err"></p>
  </div>
</div>

<script>
window.__initApp = function () {
// nav active
  const links = [...document.querySelectorAll('nav a')];
  const secs = links.map(a => document.querySelector(a.getAttribute('href')));
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  secs.forEach(s => s && io.observe(s));

  // todos
  const KEY = 'taxdash.2026-11.todos';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { saved = {}; }
  const todos = [...document.querySelectorAll('.todo')];

  function paint(el) {
    const done = el.classList.contains('done');
    el.querySelector('.box').setAttribute('aria-checked', done);
  }
  function toggle(el) {
    el.classList.toggle('done');
    saved[el.dataset.id] = el.classList.contains('done');
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    paint(el);
    count();
  }
  function count() {
    const open = todos.filter(t => !t.classList.contains('done')).length;
    document.getElementById('openCount').textContent = open + ' 項 · 依市場分類';
  }
  todos.forEach(el => {
    if (saved[el.dataset.id]) el.classList.add('done');
    paint(el);
    el.querySelector('.box').addEventListener('click', () => toggle(el));
    el.querySelector('.box').addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(el); }
    });
  });
  count();

  // filter
  const btns = [...document.querySelectorAll('.filters button')];
  const groups = [...document.querySelectorAll('.group')];
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    groups.forEach(g => {
      g.style.display = (b.dataset.f === 'all' || g.dataset.m === b.dataset.f) ? '' : 'none';
    });
  }));
};
</script>

  const P = JSON.parse(document.getElementById('payload').textContent);
  const root = document.getElementById('root');
  const lock = document.getElementById('lock');
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  const code = document.getElementById('code');
  const remember = document.getElementById('remember');

  const raw = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  async function decryptWithKey(key) {
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw(P.i) }, key, raw(P.d));
    return new TextDecoder().decode(buf);
  }
  function show(html) {
    root.innerHTML = html;
    root.hidden = false;
    lock.hidden = true;
    if (window.__initApp) window.__initApp();
  }
  async function unlock(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: raw(P.s), iterations: 310000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
    const text = await decryptWithKey(key);
    if (remember.checked) {
      const jwk = await crypto.subtle.exportKey('raw', key);
      const b = btoa(String.fromCharCode(...new Uint8Array(jwk)));
      try { localStorage.setItem(AUTH, JSON.stringify({ k: b, exp: Date.now() + 30 * DAY })); } catch (e) {}
    }
    show(text);
  }

  async function auto() {
    let a = null;
    try { a = JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch (e) {}
    if (!a || !a.k || !a.exp || a.exp < Date.now()) return false;
    try {
      const key = await crypto.subtle.importKey('raw', raw(a.k), 'AES-GCM', false, ['decrypt']);
      show(await decryptWithKey(key));
      return true;
    } catch (e) {
      try { localStorage.removeItem(AUTH); } catch (e2) {}
      return false;
    }
  }

  btn.addEventListener('click', async () => {
    const v = code.value.trim();
    if (!v) { err.textContent = '請輸入存取碼'; return; }
    btn.disabled = true; err.textContent = '';
    try { await unlock(v); }
    catch (e) { err.textContent = '存取碼不正確'; btn.disabled = false; code.select(); }
  });
  code.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

  auto().then(ok => { if (!ok) code.focus(); });
})();
</script>
</body>
</html>
